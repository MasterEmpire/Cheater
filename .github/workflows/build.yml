name: Build Universal App Release APK

on: 
  workflow_dispatch:
  repository_dispatch:
    types: [conduit_build_trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log Build Context
        if: github.event.client_payload
        run: echo "Build triggered for version ${{ github.event.client_payload.version }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          # 1. Decode Keystore
          echo "${{ secrets.SIGNING_KEY }}" | base64 -di > app/release.jks
          
          # 2. Locate SDK Tools
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/34.* | head -1)
          
          # 3. Zipalign
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*release-unsigned.apk" -o -name "*release.apk" | head -1)
          $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED_APK" app/build/outputs/apk/release/universal-app-aligned.apk

          # 4. Sign
          $BUILD_TOOLS_DIR/apksigner sign --ks app/release.jks \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/universal-app-release.apk \
            app/build/outputs/apk/release/universal-app-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/universal-app-release.apk
